{% extends "base.html" %}
{% block content %}
<h2>Student Directory</h2>
<form action="/students" method="POST" class="row g-2 bg-white p-3 shadow-sm rounded my-3">
    <div class="col-md-2"><input type="text" name="roll_no" class="form-control" placeholder="Roll No *" required></div>
    <div class="col-md-3"><input type="text" name="name" class="form-control" placeholder="Full Name *" required></div>
    <div class="col-md-2"><input type="text" name="department" class="form-control" placeholder="Department *" required></div>
    <div class="col-md-2">
        <select name="year" class="form-select">
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
        </select>
    </div>
    <div class="col-md-2"><input type="email" name="email" class="form-control" placeholder="Email"></div>
    <div class="col-md-1"><button type="submit" class="btn btn-primary w-100">Add</button></div>
</form>

<table class="table table-striped bg-white shadow-sm rounded align-middle">
    <thead class="table-dark">
        <tr><th>Roll No</th><th>Name</th><th>Department</th><th>Year</th><th>Email</th><th>Action</th></tr>
    </thead>
    <tbody>
        {% for s in students %}
        <tr>
            <td>{{ s.roll_no }}</td>
            <td>{{ s.name }}</td>
            <td>{{ s.department }}</td>
            <td>{{ years[s.year] }}</td>
            <td>{{ s.email }}</td>
            <td><a href="/students/delete/{{ s.id }}" class="btn btn-sm btn-danger">Delete</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
